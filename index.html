<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harmonium</title>
    <meta
      name="description"
      content="A hand-pumped harmonium: drag the bellows to raise air pressure, then press keys to sing a reedy note for as long as you hold it."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1 class="visually-hidden">Harmonium</h1>
      <div
        id="instrument"
        tabindex="0"
        aria-label="Harmonium spanning three octaves: mandra, madhya and taar saptak. Hold spacebar, or drag the bellows on the left, to pump air. Press keys across the keyboard's number, home and top rows to play each octave's notes, or tap the keys directly; scroll sideways to reach the full keyboard."
      >
        <div id="bellows" class="idle" aria-hidden="true">
          <div class="pleats">
            <div class="pleat"></div>
            <div class="pleat"></div>
            <div class="pleat"></div>
            <div class="pleat"></div>
            <div class="pleat"></div>
            <div class="pleat"></div>
          </div>
        </div>
        <div id="keysWrap" aria-hidden="true">
          <div id="keys"></div>
        </div>
      </div>
      <p id="status" class="visually-hidden" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
