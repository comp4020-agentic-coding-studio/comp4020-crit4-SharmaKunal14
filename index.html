<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harmonium</title>
    <meta
      name="description"
      content="A hand-pumped harmonium: drag the bellows to raise air pressure, then press keys to sing a reedy note for as long as you hold it."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1 class="visually-hidden">Harmonium</h1>
      <div
        id="instrument"
        tabindex="0"
        aria-label="Harmonium. Hold spacebar, or drag the bellows on the left, to pump air. Press keys z x c v b n m comma for the white keys and s d g h j for the black keys to play, or tap the keys directly."
      >
        <div id="bellows" aria-hidden="true">
          <div class="pleats">
            <div class="pleat"></div>
            <div class="pleat"></div>
            <div class="pleat"></div>
            <div class="pleat"></div>
            <div class="pleat"></div>
            <div class="pleat"></div>
          </div>
        </div>
        <div id="keys" aria-hidden="true"></div>
      </div>
      <p id="status" class="visually-hidden" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
